name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
    - name: Select Xcode
      run: sudo xcode-select -s "/Applications/Xcode.app"
    - name: Install tools
      run: |
        brew update
        brew install swiftlint swiftformat || true
    - name: Lint & Format (non-blocking)
      run: |
        bash Scripts/run-swiftlint.sh || true
        bash Scripts/run-swiftformat.sh || true
    - name: Build (ForavaApp, Debug)
      run: |
        xcodebuild -workspace Forava.xcworkspace -scheme ForavaApp -configuration Debug -destination 'generic/platform=iOS' build | xcpretty
