<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forava Payment - Rakhi Gift</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #3E3A9F, #FF6A6A);
            color: white;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.5em;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .message {
            font-size: 1.1em;
            margin-bottom: 30px;
            opacity: 0.9;
            line-height: 1.4;
        }
        .app-link {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 12px 24px;
            border-radius: 25px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            border: 2px solid rgba(255, 255, 255, 0.3);
            margin: 10px;
            transition: all 0.3s ease;
        }
        .app-link:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 30px;
            font-size: 0.9em;
            opacity: 0.7;
        }
    </style>
    <script>
        // Try to open in Forava app if installed
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const amount = urlParams.get('amount');
            const desc = urlParams.get('desc');
            const currency = urlParams.get('currency');
            
            // Display payment details
            if (amount) {
                document.getElementById('amount').textContent = currency + ' ' + amount;
            }
            if (desc) {
                document.getElementById('description').textContent = desc;
            }
            
            // Auto-redirect to app if on iOS
            if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
                setTimeout(function() {
                    // Try to open in Forava app
                    window.location = window.location.href;
                }, 1000);
            }
        };
    </script>
</head>
<body>
    <div class="container">
        <div class="icon">🎊</div>
        <h1>Rakhi Gift Payment</h1>
        <div class="message">
            <p><strong id="description">Rakhi Blessing Gift</strong></p>
            <p>Amount: <strong id="amount">$61</strong></p>
        </div>
        <p>This link should open in the Forava app. If the app doesn't open automatically:</p>
        <a href="https://apps.apple.com" class="app-link">Download Forava</a>
        <div class="footer">
            <p>Made with ❤️ for Raksha Bandhan</p>
        </div>
    </div>
</body>
</html>
