<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forava Payment - Rakhi Gift</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #3E3A9F, #FF6A6A);
            color: white;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.5em;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .message {
            font-size: 1.1em;
            margin-bottom: 30px;
            opacity: 0.9;
            line-height: 1.4;
        }
        .pay-button {
            display: inline-block;
            background: linear-gradient(45deg, #FF6A6A, #FFD166);
            padding: 15px 30px;
            border-radius: 25px;
            text-decoration: none;
            color: white;
            font-weight: 700;
            border: none;
            margin: 20px 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            cursor: pointer;
            font-size: 1.1em;
        }
        .pay-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .footer {
            margin-top: 30px;
            font-size: 0.9em;
            opacity: 0.7;
        }
        .fallback-message {
            text-align: left;
            line-height: 1.6;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            margin: 20px 0;
        }
        .fallback-message ul {
            margin: 15px 0;
            padding-left: 20px;
        }
        .loading {
            display: none;
            margin: 20px 0;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <script>
        let paymentParams = {};
        let senderName = 'your friend'; // Will be extracted from URL params
        
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const amount = urlParams.get('amount') || '61';
            const desc = urlParams.get('desc') || 'Rakhi Blessing Gift';
            const currency = urlParams.get('currency') || 'AUD';
            const sender = urlParams.get('sender') || 'your friend';
            
            // Store for Apple Pay and display
            paymentParams = { amount, desc, currency };
            senderName = sender;
            
            // Display payment details
            const currencySymbol = currency === 'AUD' ? 'AU$' : '$';
            document.getElementById('amount').textContent = currencySymbol + amount;
            document.getElementById('description').textContent = desc;
            
            // Show loading state
            showLoading();
            
            // Auto-trigger Apple Pay after 1.5 seconds
            setTimeout(function() {
                checkAndInitiatePayment();
            }, 1500);
        };
        
        function showLoading() {
            const container = document.querySelector('.container');
            const loadingHtml = `
                <div class="icon">🎊</div>
                <h1>Rakhi Gift Payment</h1>
                <div class="message">
                    <p><strong id="description">${paymentParams.desc}</strong></p>
                    <p>Amount: <strong id="amount">AU$${paymentParams.amount}</strong></p>
                </div>
                <div class="loading" style="display: block;">
                    <div class="spinner"></div>
                    <p>Setting up Apple Pay...</p>
                </div>
            `;
            container.innerHTML = loadingHtml;
        }
        
        function checkAndInitiatePayment() {
            // Check Apple Pay availability and device type
            if (window.ApplePaySession && ApplePaySession.canMakePayments()) {
                // Apple Pay is available - initiate immediately
                initiateApplePay();
            } else if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
                // iOS device but Apple Pay not set up
                showFallbackMessage('apple-device-no-pay');
            } else {
                // Non-Apple device
                showFallbackMessage('non-apple-device');
            }
        }
        
        function showFallbackMessage(type) {
            const container = document.querySelector('.container');
            let fallbackHtml = '';
            
            if (type === 'non-apple-device') {
                fallbackHtml = `
                    <div class="icon">🎊</div>
                    <h1>Someone sent you a beautiful Rakhi!</h1>
                    <div class="message">
                        <p><strong>${paymentParams.desc}</strong></p>
                        <p>Amount: <strong>AU$${paymentParams.amount}</strong></p>
                    </div>
                    <div class="fallback-message">
                        <p><strong>💝 To send a gift back, you can:</strong></p>
                        <ul>
                            <li>Send cash or a gift directly to ${senderName}</li>
                            <li>Make an online transfer to show your appreciation</li>
                            <li>Call them to arrange a gift exchange</li>
                        </ul>
                        <p>This Rakhi was created with love using the Forava app - available on iPhone and Apple Watch for creating personalized cultural greetings.</p>
                    </div>
                `;
            } else if (type === 'apple-device-no-pay') {
                fallbackHtml = `
                    <div class="icon">💳</div>
                    <h1>Apple Pay isn't set up on this device</h1>
                    <div class="message">
                        <p><strong>${paymentParams.desc}</strong></p>
                        <p>Amount: <strong>AU$${paymentParams.amount}</strong></p>
                    </div>
                    <div class="fallback-message">
                        <p><strong>💝 To send a gift back, you can:</strong></p>
                        <ul>
                            <li>Send a direct bank transfer or cash gift</li>
                            <li>Arrange to meet and exchange gifts in person</li>
                            <li>Use your preferred payment app to send money</li>
                        </ul>
                        <p>Or set up Apple Pay in Settings to use this quick payment feature in the future.</p>
                    </div>
                `;
            } else if (type === 'payment-failed') {
                fallbackHtml = `
                    <div class="icon">⚠️</div>
                    <h1>Payment couldn't be completed</h1>
                    <div class="fallback-message">
                        <p><strong>💝 Alternative ways to send your gift:</strong></p>
                        <ul>
                            <li>Send cash or transfer money directly</li>
                            <li>Arrange an in-person gift exchange</li>
                            <li>Use your banking app to send a transfer</li>
                        </ul>
                        <p><strong>The thought and intention matter most! ❤️</strong></p>
                    </div>
                `;
            }
            
            container.innerHTML = fallbackHtml + `
                <div class="footer">
                    <p>Made with ❤️ for Raksha Bandhan</p>
                </div>
            `;
        }
        
        function initiateApplePay() {
            try {
                const request = {
                    countryCode: 'AU',
                    currencyCode: paymentParams.currency,
                    supportedNetworks: ['visa', 'masterCard', 'amex'],
                    merchantCapabilities: ['supports3DS'],
                    total: {
                        label: 'Forava Rakhi Gift',
                        amount: paymentParams.amount
                    }
                };
                
                const session = new ApplePaySession(3, request);
                
                session.onvalidatemerchant = function (event) {
                    // TODO: In production, validate with your server
                    console.log('Validate merchant:', event.validationURL);
                    // For now, this will fail - need backend merchant validation
                    session.abort();
                    showFallbackMessage('payment-failed');
                };
                
                session.onpaymentauthorized = function (event) {
                    console.log('Payment authorized:', event.payment);
                    session.completePayment(ApplePaySession.STATUS_SUCCESS);
                    
                    // Show success message with growth funnel
                    showSuccessMessage();
                };
                
                session.begin();
                
            } catch (error) {
                console.error('Apple Pay initiation failed:', error);
                showFallbackMessage('payment-failed');
            }
        }
        
        function showSuccessMessage() {
            const container = document.querySelector('.container');
            container.innerHTML = `
                <div class="icon">✅</div>
                <h1>Gift Sent Successfully!</h1>
                <div class="message">
                    <p>Your AU$${paymentParams.amount} gift has been sent!</p>
                    <p>Thank you for spreading joy this Raksha Bandhan! 🎊</p>
                </div>
                <div class="fallback-message">
                    <p><strong>🎊 Enjoyed sending a cultural gift?</strong></p>
                    <p>Download Forava to create personalized greetings for:</p>
                    <ul>
                        <li>Chinese New Year 🧧</li>
                        <li>Birthdays 🎂</li>
                        <li>Diwali 🪔</li>
                        <li>And many more cultural celebrations!</li>
                    </ul>
                </div>
                <div class="footer">
                    <p>Made with ❤️ for Raksha Bandhan</p>
                </div>
            `;
        }
    </script>
</head>
<body>
    <div class="container">
        <!-- Content will be dynamically generated by JavaScript -->
        <div class="icon">🎊</div>
        <h1>Loading...</h1>
        <div class="loading" style="display: block;">
            <div class="spinner"></div>
            <p>Preparing your gift payment...</p>
        </div>
    </div>
</body>
</html>
