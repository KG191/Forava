<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forava Payment - Rakhi Gift</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #3E3A9F, #FF6A6A);
            color: white;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.5em;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .message {
            font-size: 1.1em;
            margin-bottom: 30px;
            opacity: 0.9;
            line-height: 1.4;
        }
        .pay-button {
            display: inline-block;
            background: linear-gradient(45deg, #FF6A6A, #FFD166);
            padding: 15px 30px;
            border-radius: 25px;
            text-decoration: none;
            color: white;
            font-weight: 700;
            border: none;
            margin: 20px 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            cursor: pointer;
            font-size: 1.1em;
        }
        .pay-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .footer {
            margin-top: 30px;
            font-size: 0.9em;
            opacity: 0.7;
        }
        .fallback-message {
            text-align: left;
            line-height: 1.6;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            margin: 20px 0;
        }
        .fallback-message ul {
            margin: 15px 0;
            padding-left: 20px;
        }
        .loading {
            display: none;
            margin: 20px 0;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <script>
        let paymentParams = {};
        let senderName = 'your friend'; // Will be extracted from URL params
        
        window.onload = function() {
            console.log('🚀 Payment page loaded, initializing...');
            console.log('🌍 User Agent:', navigator.userAgent);
            console.log('🗺️ Page URL:', window.location.href);
            console.log('🕰️ Timestamp:', new Date().toISOString());
            
            try {
                // FIRST: Parse URL parameters
                const urlParams = new URLSearchParams(window.location.search);
                const amount = urlParams.get('amount') || '61';
                const desc = urlParams.get('desc') || 'Rakhi Blessing Gift';
                const currency = urlParams.get('currency') || 'AUD';
                const sender = urlParams.get('sender') || 'Forava Creator';
                
                console.log('📊 Parsed parameters:', { amount, desc, currency, sender });
                
                // SECOND: Store parameters globally
                paymentParams = { amount, desc, currency };
                senderName = sender;
                
                console.log('💾 Stored parameters:', paymentParams);
                
                // THIRD: Show loading state (now parameters are available)
                showLoading();
                
                // FOURTH: Set up multiple timeout protection layers
                
                // Primary timeout - 8 seconds (shorter for faster fallback)
                setTimeout(function() {
                    console.log('⏰ Primary timeout check (8s) - current page state');
                    const loadingElement = document.querySelector('.loading');
                    
                    // Cross-browser compatible loading detection
                    let isStillLoading = false;
                    if (loadingElement) {
                        // Multiple methods to detect loading state
                        const displayStyle = loadingElement.style.display;
                        const computedDisplay = window.getComputedStyle ? window.getComputedStyle(loadingElement).display : displayStyle;
                        const hasLoadingClass = loadingElement.classList.contains('loading');
                        const isVisible = loadingElement.offsetParent !== null;
                        
                        isStillLoading = (computedDisplay !== 'none') || hasLoadingClass || isVisible;
                        
                        console.log('🔍 Loading state analysis:', {
                            displayStyle, computedDisplay, hasLoadingClass, isVisible, isStillLoading
                        });
                    }
                    
                    if (isStillLoading) {
                        console.log('⏰ Primary timeout (8s) - forcing fallback for stuck loading');
                        showFallbackMessage('payment-failed');
                    } else {
                        console.log('✓ Primary timeout - loading completed successfully');
                    }
                }, 8000);
                
                // Secondary timeout - 15 seconds (emergency fallback)
                setTimeout(function() {
                    console.log('⚠️ Emergency timeout (15s) - forcing fallback regardless of state');
                    const container = document.querySelector('.container');
                    const hasFailureMessage = container && container.innerHTML.includes('Alternative ways to send');
                    
                    if (!hasFailureMessage) {
                        console.log('⚠️ Emergency fallback triggered - page stuck for 15+ seconds');
                        showFallbackMessage('payment-failed');
                    }
                }, 15000);
                
                // FIFTH: Immediate Apple Pay check for faster UX (reduced from 2s to 1s)
                setTimeout(function() {
                    console.log('🍎 Starting enhanced Apple Pay check...');
                    console.log('📊 Current paymentParams:', paymentParams);
                    console.log('🔍 Current senderName:', senderName);
                    
                    // Extra safety check before proceeding
                    if (!paymentParams || !paymentParams.amount) {
                        console.error('❌ Parameters missing at trigger time - emergency fallback');
                        showFallbackMessage('payment-failed');
                        return;
                    }
                    
                    checkAndInitiatePayment();
                }, 1000);
                
            } catch (error) {
                console.error('❌ CRITICAL: Initialization error:', error);
                console.error('❌ Error stack:', error.stack);
                console.log('⚠️ Attempting emergency fallback...');
                
                // Emergency parameter reconstruction
                try {
                    const emergencyParams = new URLSearchParams(window.location.search);
                    const emergencyAmount = emergencyParams.get('amount') || '61';
                    const emergencyDesc = emergencyParams.get('desc') || 'Rakhi Blessing Gift';
                    const emergencySender = emergencyParams.get('sender') || 'your friend';
                    
                    console.log('⚠️ Emergency params:', { emergencyAmount, emergencyDesc, emergencySender });
                    
                    // Set global emergency values
                    window.paymentParams = { amount: emergencyAmount, desc: emergencyDesc, currency: 'AUD' };
                    window.senderName = emergencySender;
                    
                } catch (emergencyError) {
                    console.error('❌ Emergency parameter extraction failed:', emergencyError);
                }
                
                showFallbackMessage('payment-failed');
            }
        };
        
        function showLoading() {
            console.log('🔄 Showing loading state...');
            
            try {
                const container = document.querySelector('.container');
                
                // Ensure paymentParams exists with safe defaults
                const params = paymentParams || { amount: '61', desc: 'Rakhi Blessing Gift', currency: 'AUD' };
                
                // Validate parameters
                if (!params.amount || !params.desc || !params.currency) {
                    console.error('❌ Invalid payment parameters:', params);
                    showFallbackMessage('payment-failed');
                    return;
                }
                const currencySymbol = params.currency === 'AUD' ? 'AU$' : '$';
                
                console.log('📝 Using parameters for loading:', params);
                
                const loadingHtml = `
                    <div class="icon">🎊</div>
                    <h1>Rakhi Gift Payment</h1>
                    <div class="message">
                        <p><strong>${params.desc}</strong></p>
                        <p>Amount: <strong>${currencySymbol}${params.amount}</strong></p>
                    </div>
                    <div class="loading" style="display: block;">
                        <div class="spinner"></div>
                        <p>Preparing your Gift in Return...</p>
                    </div>
                `;
                container.innerHTML = loadingHtml;
                
                console.log('✅ Loading state displayed');
                
            } catch (error) {
                console.error('❌ Error in showLoading:', error);
                // Fallback to simple loading if there's an error
                const container = document.querySelector('.container');
                if (container) {
                    container.innerHTML = `
                        <div class="icon">🎊</div>
                        <h1>Loading...</h1>
                        <div class="loading" style="display: block;">
                            <div class="spinner"></div>
                            <p>Preparing your Gift in Return...</p>
                        </div>
                    `;
                } else {
                    console.error('❌ Container element not found');
                    showFallbackMessage('payment-failed');
                }
            }
        }
        
        function checkAndInitiatePayment() {
            console.log('🔍 Checking Apple Pay availability...');
            console.log('📊 Payment params check:', paymentParams);
            console.log('👥 Sender name check:', senderName);
            
            // Final parameter validation before proceeding
            if (!paymentParams || !paymentParams.amount) {
                console.error('❌ Payment parameters missing in checkAndInitiatePayment');
                showFallbackMessage('payment-failed');
                return;
            }
            
            try {
                // Enhanced cross-browser device detection
                const userAgent = navigator.userAgent;
                const isIOS = /iPad|iPhone|iPod/.test(userAgent);
                const isMac = /Mac OS X|macOS/.test(userAgent);
                const isAppleWatch = /Watch/.test(userAgent);
                
                // Explicit Windows/non-Apple device detection
                const isWindows = /Windows NT|Windows/.test(userAgent);
                const isAndroid = /Android/.test(userAgent);
                const isLinux = /Linux/.test(userAgent) && !isAndroid;
                const isChrome = /Chrome/.test(userAgent);
                const isFirefox = /Firefox/.test(userAgent);
                const isEdge = /Edge|Edg/.test(userAgent);
                
                const isDefinitelyNonApple = isWindows || isAndroid || isLinux;
                
                console.log('📱 Enhanced device info:', { 
                    userAgent, isIOS, isMac, isAppleWatch, 
                    isWindows, isAndroid, isLinux, isChrome, isFirefox, isEdge,
                    isDefinitelyNonApple 
                });
                
                // Safe ApplePaySession availability check
                let applePayAvailable = false;
                let canMakePayments = false;
                
                try {
                    applePayAvailable = !!(window.ApplePaySession);
                    if (applePayAvailable) {
                        canMakePayments = ApplePaySession.canMakePayments();
                    }
                } catch (applePayError) {
                    console.log('🚫 ApplePaySession check failed:', applePayError);
                    applePayAvailable = false;
                    canMakePayments = false;
                }
                
                console.log('🍎 ApplePaySession available:', applePayAvailable);
                console.log('💳 Can make payments:', canMakePayments);
                
                // Immediate fallback for definitely non-Apple devices
                if (isDefinitelyNonApple) {
                    console.log('🖥️ Definitely non-Apple device detected - immediate fallback');
                    showFallbackMessage('non-apple-device');
                    return;
                }
                
                // Apple Pay check for potential Apple devices
                if (applePayAvailable && canMakePayments) {
                    console.log('✅ Apple Pay is available - initiating...');
                    initiateApplePay();
                    return;
                }
                
                // Enhanced fallback logic for remaining cases
                if (isIOS || isAppleWatch) {
                    console.log('📱 iOS/Watch device but Apple Pay not available');
                    showFallbackMessage('apple-device-no-pay');
                } else if (isMac) {
                    console.log('💻 Mac device but Apple Pay not available');
                    showFallbackMessage('apple-device-no-pay');
                } else {
                    // Catch-all for any remaining non-Apple scenarios
                    console.log('🖥️ Non-Apple device or unrecognized platform');
                    showFallbackMessage('non-apple-device');
                }
                
            } catch (error) {
                console.error('❌ Error in checkAndInitiatePayment:', error);
                showFallbackMessage('payment-failed');
            }
        }
        
        function showFallbackMessage(type) {
            console.log('💬 Showing fallback message:', type);
            console.log('📊 Current paymentParams:', paymentParams);
            console.log('👥 Current senderName:', senderName);
            
            try {
                const container = document.querySelector('.container');
                if (!container) {
                    console.error('❌ Container element not found for fallback message');
                    // Create emergency fallback if container missing
                    document.body.innerHTML = `
                        <div style="text-align: center; padding: 20px; font-family: -apple-system, sans-serif;">
                            <h1>Gift Payment</h1>
                            <p>Please send your gift directly to the sender.</p>
                        </div>
                    `;
                    return;
                }
                
                let fallbackHtml = '';
                
                // Comprehensive loading state cleanup
                const loadingElements = document.querySelectorAll('.loading');
                loadingElements.forEach(element => {
                    element.style.display = 'none';
                    element.style.visibility = 'hidden';
                    element.classList.remove('loading');
                });
                
                // Ensure we have safe parameter defaults
                const safeParams = paymentParams || { amount: '61', desc: 'Rakhi Blessing Gift', currency: 'AUD' };
                const safeSender = senderName || 'your friend';
                const currencySymbol = safeParams.currency === 'AUD' ? 'AU$' : '$';
                
                console.log('🔒 Using safe parameters:', { safeParams, safeSender, currencySymbol });
                
                if (type === 'non-apple-device') {
                fallbackHtml = `
                    <div class="icon">🎊</div>
                    <h1>Someone sent you a beautiful Rakhi!</h1>
                    <div class="message">
                        <p><strong>${safeParams.desc}</strong></p>
                        <p>Amount: <strong>${currencySymbol}${safeParams.amount}</strong></p>
                    </div>
                    <div class="fallback-message">
                        <p><strong>💝 To send a gift back, you can:</strong></p>
                        <ul>
                            <li>Send cash or a gift directly to ${safeSender}</li>
                            <li>Make an online transfer to show your appreciation</li>
                            <li>Call them to arrange a gift exchange</li>
                        </ul>
                        <p>This Rakhi was created with love using the Forava app - available on iPhone and Apple Watch for creating personalized cultural greetings.</p>
                    </div>
                `;
            } else if (type === 'apple-device-no-pay') {
                fallbackHtml = `
                    <div class="icon">💳</div>
                    <h1>Apple Pay isn't set up on this device</h1>
                    <div class="message">
                        <p><strong>${safeParams.desc}</strong></p>
                        <p>Amount: <strong>${currencySymbol}${safeParams.amount}</strong></p>
                    </div>
                    <div class="fallback-message">
                        <p><strong>💝 To send a gift back, you can:</strong></p>
                        <ul>
                            <li>Send a direct bank transfer or cash gift</li>
                            <li>Arrange to meet and exchange gifts in person</li>
                            <li>Use your preferred payment app to send money</li>
                        </ul>
                        <p>Or set up Apple Pay in Settings to use this quick payment feature in the future.</p>
                    </div>
                `;
            } else if (type === 'payment-failed') {
                fallbackHtml = `
                    <div class="icon">⚠️</div>
                    <h1>Payment couldn't be completed</h1>
                    <div class="fallback-message">
                        <p><strong>💝 Alternative ways to send your gift:</strong></p>
                        <ul>
                            <li>Send cash or transfer money directly to ${safeSender}</li>
                            <li>Arrange an in-person gift exchange</li>
                            <li>Use your banking app to send a transfer</li>
                        </ul>
                        <p><strong>The thought and intention matter most! ❤️</strong></p>
                    </div>
                `;
            }
            
                // Set the fallback content with error handling
                try {
                    container.innerHTML = fallbackHtml + `
                        <div class="footer">
                            <p>Made with ❤️ for Raksha Bandhan</p>
                        </div>
                    `;
                    console.log('✓ Fallback message displayed successfully for type:', type);
                } catch (htmlError) {
                    console.error('❌ Error setting fallback HTML:', htmlError);
                    // Ultimate fallback - simple text
                    container.innerHTML = `
                        <div style="padding: 20px; text-align: center;">
                            <h1>Rakhi Gift</h1>
                            <p>Please send your gift directly to ${safeSender}</p>
                            <p>Amount: ${currencySymbol}${safeParams.amount}</p>
                        </div>
                    `;
                }
                
            } catch (error) {
                console.error('❌ Critical error in showFallbackMessage:', error);
                // Emergency fallback for complete failure
                try {
                    document.body.innerHTML = `
                        <div style="text-align: center; padding: 40px; font-family: -apple-system, sans-serif; background: linear-gradient(135deg, #3E3A9F, #FF6A6A); color: white; min-height: 100vh;">
                            <h1>Rakhi Gift Payment</h1>
                            <p>Please contact the sender directly to arrange your gift exchange.</p>
                            <p>Made with ❤️ for Raksha Bandhan</p>
                        </div>
                    `;
                } catch (finalError) {
                    console.error('❌ Final emergency fallback failed:', finalError);
                }
            }
        }
        
        function initiateApplePay() {
            console.log('🚀 Initiating Apple Pay...');
            console.log('📊 Apple Pay params check:', paymentParams);
            
            try {
                // Comprehensive parameter validation
                if (!paymentParams || !paymentParams.amount) {
                    console.error('❌ Payment parameters validation failed:', paymentParams);
                    console.error('❌ Global paymentParams:', window.paymentParams);
                    console.error('❌ Available URL params:', new URLSearchParams(window.location.search).toString());
                    throw new Error('Payment parameters not available for Apple Pay');
                }
                
                console.log('✓ Apple Pay parameters validated successfully');
                console.log('💰 Processing amount:', paymentParams.amount);
                console.log('📋 Description:', paymentParams.desc);
                console.log('💱 Currency:', paymentParams.currency);
                
                const request = {
                    countryCode: 'AU',
                    currencyCode: paymentParams.currency,
                    supportedNetworks: ['visa', 'masterCard', 'amex'],
                    merchantCapabilities: ['supports3DS'],
                    total: {
                        label: 'Forava Rakhi Gift',
                        amount: paymentParams.amount
                    }
                };
                
                console.log('📋 Apple Pay request:', request);
                
                const session = new ApplePaySession(3, request);
                
                session.onvalidatemerchant = function (event) {
                    console.log('🔐 Merchant validation required:', event.validationURL);
                    // Since we don't have merchant validation backend yet, 
                    // we'll abort and show fallback
                    console.log('⚠️ No merchant validation server available, showing fallback');
                    session.abort();
                    showFallbackMessage('payment-failed');
                };
                
                session.onpaymentauthorized = function (event) {
                    console.log('✅ Payment authorized:', event.payment);
                    session.completePayment(ApplePaySession.STATUS_SUCCESS);
                    showSuccessMessage();
                };
                
                session.oncancel = function() {
                    console.log('❌ Apple Pay cancelled by user');
                    showFallbackMessage('payment-failed');
                };
                
                console.log('🎬 Starting Apple Pay session...');
                session.begin();
                
            } catch (error) {
                console.error('❌ Apple Pay initiation failed:', error);
                showFallbackMessage('payment-failed');
            }
        }
        
        function showSuccessMessage() {
            const container = document.querySelector('.container');
            container.innerHTML = `
                <div class="icon">✅</div>
                <h1>Gift Sent Successfully!</h1>
                <div class="message">
                    <p>Your AU$${paymentParams.amount} gift has been sent!</p>
                    <p>Thank you for spreading joy this Raksha Bandhan! 🎊</p>
                </div>
                <div class="fallback-message">
                    <p><strong>🎊 Enjoyed sending a cultural gift?</strong></p>
                    <p>Download Forava to create personalized greetings for:</p>
                    <ul>
                        <li>Chinese New Year 🧧</li>
                        <li>Birthdays 🎂</li>
                        <li>Diwali 🪔</li>
                        <li>And many more cultural celebrations!</li>
                    </ul>
                </div>
                <div class="footer">
                    <p>Made with ❤️ for Raksha Bandhan</p>
                </div>
            `;
        }
    </script>
</head>
<body>
    <div class="container">
        <!-- Content will be dynamically generated by JavaScript -->
        <div class="icon">🎊</div>
        <h1>Loading...</h1>
        <div class="loading" style="display: block;">
            <div class="spinner"></div>
            <p>Preparing your Gift in Return...</p>
        </div>
    </div>
</body>
</html>
